name: Collect AI News

on:
  schedule:
    # 每 6 小时
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pipeline dependencies
        working-directory: ./aides-pipeline
        run: npm ci --omit=dev

      - name: Collect news (方案 A)
        working-directory: ./aides-pipeline
        env:
          # 不设置 LLM_API_KEY 让 LLM 步骤跳过，保证无密钥也能跑
          CI: 'true'
        run: npx tsx src/collect.ts

      - name: Commit news data
        uses: stefanzweifel/git-auto-commit@v5
        with:
          commit_message: 'chore(news): update AI news data [skip ci]'
          file_pattern: 'aides/static/data/ai-news.json'
