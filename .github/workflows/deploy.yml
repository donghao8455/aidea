name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: aides/package-lock.json

      - name: Install dependencies
        working-directory: ./aides
        run: npm ci

      - name: Build site
        working-directory: ./aides
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aides:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aides:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server (pull GHCR image)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 登录 GHCR（使用 GitHub PAT 或部署密钥）
            echo "${{ secrets.GHCR_DEPLOY_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # 拉取新镜像
            docker pull ghcr.io/${{ github.repository_owner }}/aides:${{ github.sha }}

            # 停止并删除旧容器
            docker stop aides || true
            docker rm aides || true

            # 启动新容器
            docker run -d \
              --name aides \
              --restart unless-stopped \
              -p 80:80 \
              ghcr.io/${{ github.repository_owner }}/aides:${{ github.sha }}

            # 清理旧镜像
            docker image prune -f

            echo "Deployment completed successfully!"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: aides/package-lock.json

      - name: Install dependencies
        working-directory: ./aides
        run: npm ci

      - name: Check TypeScript
        working-directory: ./aides
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: ./aides
        run: npm run lint || true
